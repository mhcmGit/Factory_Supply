name: "Build and Deploy"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Build Assets
        run: npm install && npm run build

      - name: Build Site
        id: buildsite
        continue-on-error: true # TEMP report, will be re-set strict after diagnosis
        run: |
          set +e
          bundle exec jekyll b --baseurl "${{ steps.pages.outputs.base_path }}" -d "_site${{ steps.pages.outputs.base_path }}" > /tmp/jekyll.log 2>&1
          ec=$?
          { echo "### Jekyll build exit=$ec"; echo '```text'; cat /tmp/jekyll.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $ec
        env:
          JEKYLL_ENV: "production"

      - name: Test Site
        continue-on-error: true # report broken links but never block deployment
        run: |
          bundle exec htmlproofer "_site${{ steps.pages.outputs.base_path }}" \
            \-\-url-swap "${{ steps.pages.outputs.base_path }}/:/" \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
